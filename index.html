<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水污染防治設施操作維護(甲乙級)全系列智慧練習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold">水污染防治設施 (甲乙級) 綜合模擬考</h1>
            <span id="progress-badge" class="text-xs sm:text-sm bg-blue-700 px-3 py-1 rounded-full font-semibold">智慧抽題</span>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-2xl mx-auto w-full p-4 my-4 flex-grow">
        
        <!-- 章節與級別切換選單 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-4 border border-slate-100">
            <h3 class="text-sm font-bold text-slate-700 mb-2">選擇練習章節與級別：</h3>
            <div id="chapter-buttons" class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onclick="switchChapter('ch1')" id="btn-ch1" class="p-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow">01 概論與實務(甲乙)</button>
                <button onclick="switchChapter('ch2')" id="btn-ch2" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">02 法規簡介(甲乙)</button>
                <button onclick="switchChapter('ch3')" id="btn-ch3" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">03 許可與申報(甲乙)</button>
                <button onclick="switchChapter('ch4_b')" id="btn-ch4_b" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">04 物化處理(乙級)</button>
                <button onclick="switchChapter('ch4_a')" id="btn-ch4_a" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">04 物化處理(甲級)</button>
                <button onclick="switchChapter('ch5')" id="btn-ch5" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">05 生物處理(甲乙)</button>
                <button onclick="switchChapter('ch6_b')" id="btn-ch6_b" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">06 污泥減量(乙級)</button>
                <button onclick="switchChapter('ch6_a')" id="btn-ch6_a" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">06 污泥減量(甲級)</button>
                <button onclick="switchChapter('ch7_b')" id="btn-ch7_b" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">07 操作應變(乙級)</button>
                <button onclick="switchChapter('ch7_a')" id="btn-ch7_a" class="p-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">07 操作應變(甲級)</button>
            </div>
        </div>

        <!-- 各章教材來源與下載資訊卡片 -->
        <div id="material-info-card" class="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-4 text-xs sm:text-sm text-blue-900 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <span class="font-bold">📖 教材來源：</span><span id="source-text">國家環境研究院（國環院）專責人員訓練教材</span>
            </div>
            <a id="download-link" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-medium shadow transition shrink-0">
                📥 下載本章PDF教材
            </a>
        </div>
        
        <!-- 測驗進行中介面 -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <!-- 進度條 -->
            <div class="w-full bg-slate-200 rounded-full h-2 mb-6">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="flex justify-between items-center text-sm text-slate-500 mb-2">
                <span id="question-counter" class="font-semibold text-blue-600">第 1 題 / 共 50 題</span>
                <span id="score-keeper" class="font-medium text-slate-600">目前得分: 0</span>
            </div>

            <h2 id="question-title" class="text-lg sm:text-xl font-bold text-slate-800 mb-6 leading-relaxed">載入中...</h2>

            <!-- 選項清單 -->
            <div id="options-container" class="space-y-3"></div>

            <!-- 回饋與解析提示框 -->
            <div id="feedback-box" class="mt-6 p-5 rounded-xl hidden transition-all border shadow-sm">
                <p id="feedback-text" class="text-sm sm:text-base leading-relaxed"></p>
            </div>

            <!-- 下一題按鈕 -->
            <div class="mt-8 flex justify-end">
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-blue-200 transition hidden">
                    下一題
                </button>
            </div>
        </div>

        <!-- 測驗結算畫面 -->
        <div id="result-card" class="bg-white rounded-2xl shadow-xl p-8 text-center hidden">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold shadow-inner">
                🎉
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">本章測驗結算報告</h2>
            <p class="text-slate-500 mb-6">您已完成本次模擬練習！</p>
            
            <div class="bg-slate-50 rounded-2xl p-6 mb-6 border border-slate-100">
                <div class="text-sm text-slate-500 mb-1">最終得分</div>
                <div id="final-score-text" class="text-4xl font-extrabold text-blue-600 mb-2">0 分</div>
                <div id="final-stats-text" class="text-sm text-slate-600">正確 0 題 / 錯誤 0 題</div>
            </div>

            <button onclick="initQuiz(currentChapter)" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-blue-200 transition">
                再次挑戰本章
            </button>
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="text-center py-4 text-slate-400 text-xs">
        水污染防治設施操作維護 (甲乙級) 智慧練習系統
    </footer>

    <!-- 引入所有章節題庫與主程式 -->
    <script src="quiz-data.js"></script>
    <script src="chapter2-data.js"></script>
    <script src="chapter3-data.js"></script>
    <script src="chapter4_b-data.js"></script>
    <script src="chapter4_a-data.js"></script>
    <script src="chapter5-data.js"></script>
    <script src="chapter6_b-data.js"></script>
    <script src="chapter6_a-data.js"></script>
    <script src="chapter7_b-data.js"></script>
    <script src="chapter7_a-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
